name: JavaScript CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    container:
      image: node:24

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run JavaScript file
        run: node index.js

